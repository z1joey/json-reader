name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish macOS dmg
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify tag matches MARKETING_VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(grep -m1 'MARKETING_VERSION' JSONReader.xcodeproj/project.pbxproj | sed -E 's/.*= ?"?([0-9a-zA-Z.]+)"?;/\1/')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $pkg_version"
            exit 1
          fi
      - name: Test
        run: >
          xcodebuild -project JSONReader.xcodeproj -scheme JSONReader
          -configuration Debug -derivedDataPath build/DerivedData
          -destination 'platform=macOS' test
      - name: Build universal dmg
        run: ./scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="> This build is ad-hoc signed and not notarized, so macOS Gatekeeper warns on first launch — recent macOS may even say the app is damaged. It is not. Run \`xattr -cr \"/Applications/JSONReader.app\"\` once after installing, or use Open Anyway in System Settings → Privacy & Security."
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes
