appId: com.z1joey.json-reader
productName: json-reader
directories:
  output: dist
files:
  - out/**
  - package.json
mac:
  target:
    - target: dmg
      arch:
        - arm64
  # Ad-hoc signing (no Apple developer certificate): re-signs the packaged
  # bundle so its seal matches its contents. Without this the download is
  # reported as damaged by Gatekeeper. Hardened runtime stays off — ad-hoc
  # builds get no benefit from it and it can break launching via library
  # validation.
  identity: "-"
  hardenedRuntime: false
